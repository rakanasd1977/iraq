# ===== عكس وكيل API المشترك (يُضمَّن داخل server block) =====
# كل النقاط الجديدة (financial-report, agent/dashboard/export, فلاتر activity)
# تقع تحت /api/ فتمر تلقائياً عبر هذا الوكيل دون أي تعديل في الإعداد.

location /api/ {
    include nginx.headers.conf;
    add_header Cache-Control "no-store" always;
    # حدّ الطلبات على مستوى nginx (دفاع إضافي قبل الوصول إلى Node). يشترط تعريف
    # منطقة limit_req_zone (مثال: في http من nginx.conf المحلي، أو في http من nginx.conf الرئيسي
    # في الإنتاج):  limit_req_zone $binary_remote_addr zone=apiperip:10m rate=10r/s;
    limit_req zone=apiperip burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}
