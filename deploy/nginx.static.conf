# ===== خدمة الملفات الساكنة المشتركة لكل واجهة (يُضمَّن داخل server block) =====
# sw.js لا يُخزَّن مؤقتاً أبداً؛ index.html يتحدث دائماً؛
# assets ذات الاسم المبعثر (hash) تُخزَّن طويلاً بأمان.

location = /sw.js {
    include D:/1h1h/deploy/nginx.headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files /sw.js =404;
}

location = /index.html {
    include D:/1h1h/deploy/nginx.headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /assets/ {
    include D:/1h1h/deploy/nginx.headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 1024;
