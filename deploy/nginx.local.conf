# ===== سوق الرافدين — nginx محلي (Windows) لاختبار النشر =====
# يقدّم التطبيقات الأربعة من dist مباشرة + يعكس /api إلى الخادم 4001.
# الاستخدام:  powershell -ExecutionPolicy Bypass -File deploy/start-nginx.ps1
# المنافذ: الزبون 8081 · الوكيل 8082 · المسؤول 8083 · المزود 8084
# يعمل مع D:/1h1h — إن نُقل المشروع عدّل الجذور أو انسخ dist إلى مسارات ثابتة.

events {
    worker_connections 1024;
}

http {
    include       C:/tools/nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # منطقة حدّ الطلبات لواجهة API (تُستهلك في nginx.api.conf عبر limit_req)
    limit_req_zone $binary_remote_addr zone=apiperip:10m rate=10r/s;

    # ---------- تطبيق الزبون ----------
    server {
        listen 8081;
        server_name localhost;
        root D:/1h1h/customer-mobile/dist;
        index index.html;
        include D:/1h1h/deploy/nginx.headers.conf;
        include D:/1h1h/deploy/nginx.static.conf;
        include D:/1h1h/deploy/nginx.api.conf;
    }

    # ---------- لوحة الوكيل ----------
    server {
        listen 8082;
        server_name localhost;
        root D:/1h1h/agent-panel/dist;
        index index.html;
        include D:/1h1h/deploy/nginx.headers.conf;
        include D:/1h1h/deploy/nginx.static.conf;
        include D:/1h1h/deploy/nginx.api.conf;
    }

    # ---------- لوحة المسؤول ----------
    server {
        listen 8083;
        server_name localhost;
        root D:/1h1h/admin-panel/dist;
        index index.html;
        include D:/1h1h/deploy/nginx.headers.conf;
        include D:/1h1h/deploy/nginx.static.conf;
        include D:/1h1h/deploy/nginx.api.conf;
    }

    # ---------- لوحة المزود ----------
    server {
        listen 8084;
        server_name localhost;
        root D:/1h1h/provider-panel/dist;
        index index.html;
        include D:/1h1h/deploy/nginx.headers.conf;
        include D:/1h1h/deploy/nginx.static.conf;
        include D:/1h1h/deploy/nginx.api.conf;
    }
}
