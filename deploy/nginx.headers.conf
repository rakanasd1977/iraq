# ===== رؤوس أمان مشتركة لكل الاستجابات =====
# يُضمَّن في كل server block وفي كل location يضيف Cache-Control خاصاً به
# (لأن add_header في nginx يُسقط الرؤوس الموروثة عند استخدامه في location).

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# CSP فعّال — يطابق سدة البناء shared/vite-plugin-csp.js وmeta في index.html:
# script/connect صارمة 'self'؛ الصور تسمح بـ https: لأن بيانات/إعلانات قد تحمل صوراً خارجية؛
# style-src تسمح بالأنماط المضمّنة التي تولدها React (style attr).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
# HSTS بعد إتمام HTTPS في الإنتاج (يُفعل هناك داخل block الـ ssl)
